name: Release

# Push a tag like v2.1.0 (must equal deckdrop.__version__) to build the
# AppImage, write + sign release.json and publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  appimage:
    name: Build & publish AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches version
        run: python packaging/release_tool.py check-version "${GITHUB_REF_NAME}"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          PYTHON: python3
        run: bash packaging/build-appimage.sh --clean

      - name: Manifest, signature, checksums
        env:
          DECKDROP_SIGNING_KEY: ${{ secrets.DECKDROP_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-release
          cp "DeckDrop-${VERSION}-x86_64.AppImage" dist-release/
          python packaging/release_tool.py manifest dist-release/release.json \
            "dist-release/DeckDrop-${VERSION}-x86_64.AppImage"
          python packaging/release_tool.py sign dist-release/release.json
          (cd dist-release && sha256sum DeckDrop-*.AppImage release.json > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "DeckDrop ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist-release/*
